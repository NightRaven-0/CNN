[project]
name = "arc-cxr"
version = "0.1.0"
description = "Anatomy-routed CNN for chest radiography with architecturally-grounded explanations"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0.15",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pydicom>=3.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "albumentations>=2.0",
    "monai>=1.4",
    "grad-cam>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "matplotlib>=3.9",
    "tensorboard>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc"]

# RTX 5070 Ti is Blackwell (sm_120). The default PyPI torch wheels do not carry
# sm_120 kernels; CUDA 12.8 builds do. Without this the GPU silently falls back
# or errors with "no kernel image is available for execution on the device".
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
